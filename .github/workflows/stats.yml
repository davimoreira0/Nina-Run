name: repo-stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: run-gh-stats
        uses: jgehrcke/github-repo-stats@v1.4.1
        with:
          repository: davimoreira0/Nina-Run
          ghtoken: ${{ secrets.GITHUB_TOKEN }}
